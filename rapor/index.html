<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Performans Raporu</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>

<div id="loadingState" class="state-screen">
  <div class="spinner"></div>
  <p>Rapor hazırlanıyor…</p>
</div>

<div id="errorState" class="state-screen" style="display:none;">
  <p>Bu bağlantı geçersiz görünüyor. Lütfen ajansınızla iletişime geçin.</p>
</div>

<div id="reportRoot" class="shell" style="display:none;">

  <header class="report-header fade-in">
    <div class="report-header__brand">
      <div class="report-header__logo" id="brandLogo"><span>LOGO</span></div>
      <div class="report-header__title">
        <span class="eyebrow">Performans Raporu</span>
        <h1 id="brandName">—</h1>
      </div>
    </div>
    <div class="report-header__meta">
      <span class="eyebrow">Rapor Tarihi</span>
      <span class="date" id="reportDate">—</span>
    </div>
  </header>

  <section class="metrics-grid fade-in">
    <div class="metric-card">
      <div class="metric-card__label"><svg class="mi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a2 2 0 0 0 2 2h1l3 5V4l-3 5H5a2 2 0 0 0-2 2z"/><path d="M14 8a4 4 0 0 1 0 8"/></svg>Reklam Harcama Tutarı</div>
      <div class="metric-card__value"><span class="unit">₺</span><span id="mAdSpend">0</span></div>
    </div>
    <div class="metric-card">
      <div class="metric-card__label"><svg class="mi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.4"/></svg>Ciro</div>
      <div class="metric-card__value"><span class="unit">₺</span><span id="mRevenue">0</span></div>
    </div>
    <div class="metric-card metric-card--hero">
      <div class="metric-card__label">ROAS</div>
      <div class="metric-card__value" id="mRoas">—</div>
    </div>
    <div class="metric-card">
      <div class="metric-card__label"><svg class="mi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M1.5 1.5h3l2.68 13.39a2 2 0 0 0 2 1.61h8.72a2 2 0 0 0 2-1.61L22 6.5H6"/></svg>Sepete Ekleme</div>
      <div class="metric-card__value"><span id="mAddToCart">0</span></div>
    </div>
    <div class="metric-card">
      <div class="metric-card__label"><svg class="mi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2.5"/><line x1="2" y1="10" x2="22" y2="10"/></svg>Ödeme Adımına Geçme</div>
      <div class="metric-card__value"><span id="mCheckout">0</span></div>
    </div>
    <div class="metric-card">
      <div class="metric-card__label"><svg class="mi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/></svg>Toplam Sipariş Adedi</div>
      <div class="metric-card__value"><span id="mOrders">0</span></div>
    </div>
  </section>

  <div class="section-title fade-in">
    <h2>En İyi Kancalar</h2>
  </div>

  <section class="hooks-grid fade-in" id="hooksGrid">
    <div class="hooks-empty">Bu aya ait kanca videosu henüz eklenmedi.</div>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabaseClient.js"></script>
<script src="../assets/js/report.js"></script>
</body>
</html>
